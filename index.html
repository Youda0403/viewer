<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f1efe7" />
  <title>Roll20 채팅 미리보기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Roll20 채팅 미리보기</h1>
    <p class="tagline">롤20에 직접 보내지 않고도 <code>[내용](#" style="…)</code> 매크로 결과를 바로 확인.</p>
  </header>

  <main class="layout">
    <section class="pane pane-input">
      <div class="pane-head"><h2>입력</h2></div>
      <div class="pane-body">
        <textarea id="macro-input" rows="14" spellcheck="false"
          autocorrect="off" autocapitalize="off" autocomplete="off"
          placeholder='/desc [비가 내리고 있다.](#" style="color:#666; font-style:italic;)'></textarea>
        <div class="actions">
          <button type="button" id="copy-btn" class="primary">코드 복사</button>
          <button type="button" id="clear-input-btn">입력 지우기</button>
        </div>
        <p class="hint">
          줄마다 한 메시지로 처리해요. <code>/desc</code>, <code>/as</code> 인식.
          <code>?{질문}</code> 은 질문 텍스트로, 이미지 URL은 이미지로, <code>``코드``</code> 는 코랄색 인라인 코드로 표시돼요.
          붙여넣을 때 끼어드는 <code>“ ”</code> 스마트따옴표는 자동으로 <code>"</code> 로 정리돼요.
        </p>
      </div>
    </section>

    <section class="pane pane-chat">
      <div class="pane-head">
        <h2>채팅 미리보기</h2>
        <button type="button" id="chat-bg-toggle" class="bg-toggle"
                title="채팅 배경 색 바꾸기 (밝음/어두움)">🌗</button>
      </div>
      <div class="chat-window" id="chat-window">
        <div class="chat-empty" id="chat-empty">왼쪽에 매크로를 입력하면 여기에 미리보기가 떠요.</div>
      </div>
    </section>

    <aside class="pane pane-warnings">
      <div class="pane-head">
        <h2>필터 결과</h2>
        <span class="badge" id="warn-badge">0</span>
      </div>
      <div class="pane-body warnings-body" id="warnings-body">
        <p class="empty">아직 검사할 매크로가 없어요.</p>
      </div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
